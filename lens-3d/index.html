<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>镜头数据编辑器</title>
  <link rel="stylesheet" href="css/style.css?v=1.1.8">
</head>
<body>
  <div id="app">
    <aside id="side">
      <div class="side-head">
        <div>
          <div class="side-title">镜头数据编辑器</div>
          <div class="side-sub">M1+ · LDM 表格直接编辑 · 2D/3D 实时同步</div>
        </div>
        <div class="theme-switch" id="themeSwitch" title="切换主题">
          <button class="theme-dot" data-theme="blue" title="深空蓝" style="background:#4cc2ff"></button>
          <button class="theme-dot" data-theme="graphite" title="石墨黑" style="background:#cfd8e3"></button>
          <button class="theme-dot" data-theme="violet" title="极夜紫" style="background:#b388ff"></button>
          <button class="theme-dot" data-theme="forest" title="松林绿" style="background:#5fd0a0"></button>
          <button class="theme-dot" data-theme="light" title="日间浅色" style="background:#ffffff"></button>
        </div>
      </div>

      <div class="topbar">
        <select id="demoSelect">
          <option value="Advanced_SC_doubleGauss_final.zmx">双高斯 Advanced_SC</option>
          <option value="Cooke 40 degree field.zmx">Cooke 40° 三片</option>
        </select>
        <button id="importFile" class="btn">导入 .zmx/.seq</button>
        <input id="fileInput" type="file" accept=".zmx,.seq" hidden>
        <button id="newDemo" class="btn ghost">重置</button>
      </div>

      <div class="fieldbar">
        <label title="Zemax 视场=半视场角(半FOV)。全视场=2×半视场角。如半视场20°=全视场40°。">视场模式
          <select id="fmode">
            <option value="angle" selected>半视场角 °</option>
            <option value="height">像高 mm</option>
          </select>
        </label>
        <label title="逗号分隔多视场（半视场角° 或 像高mm，按读取的文件值）">值
          <input id="fvals" type="text" value="0" spellcheck="false">
        </label>
        <label title="每个视场的光线数(入瞳内,上取奇数)">光线数
          <input id="npupil" type="number" value="15" min="1" max="33" step="2">
        </label>
        <label title="像方工作F/#：入瞳直径=|EFL|/F#">工作F数
          <input id="wfn" type="number" value="8" placeholder="空=由光阑定" min="0.5" step="0.1">
        </label>
        <button id="autoVig" type="button" title="按净口径/半孔径自动计算逐视场渐晕(被渐晕光线不显示)">自动渐晕</button>
        <button id="refreshBtn" type="button" title="一键刷新：表格/2D/3D/当前图表(点列图/相对照度/MTF) 全部重渲染">刷新</button>
        <span id="fieldVig" class="vig">未追迹</span>
      </div>

      <div class="wlbar">
        <div class="wl-head">
          <span>波长 / 权重</span>
          <button id="wlAdd" type="button">＋ 添加</button>
          <button id="wlPreset" type="button" title="F/d/C 三色(色散)">F/d/C</button>
          <button id="wlOnly" type="button" title="只保留主波长">仅主</button>
        </div>
        <div id="wltable" class="wl-table"></div>
        <div class="wl-note">●主波长用于 EFL/F#·像高；权重用于后续 MTF/点列平均；按波长分色展示</div>
      </div>

      <div id="ldm" class="ldm-root"></div>
    </aside>
    <div id="sideGrip" class="grip-v" title="拖动调整左侧(LDM)窗口宽度"></div>

    <main id="stage">
      <section id="panel2d">
        <div class="panel-head">
          <div class="tabs">
            <button id="tabSpot" class="tab active" type="button">点列图</button>
            <button id="tabIllum" class="tab" type="button">相对照度</button>
            <button id="tabMtf" class="tab" type="button">MTF</button>
          </div>
          <span id="layoutBadge" class="layoutBadge"></span>
        </div>
        <div class="panel2d-body">
          <div id="spotView" class="spotView on">
            <div class="spot-ctrl">
              <label title="入瞳内采样网格密度">网格 <input id="spotGrid" type="number" value="15" min="5" max="41" step="2"></label>
              <label title="显示哪些视场">场 <select id="spotField"><option value="all">全部</option></select></label>
              <label title="用哪个波长">波长 <select id="spotWavelength"><option value="primary">主波长</option></select></label>
              <label title="绘制艾里斑(衍射极限)参考圆"><input id="spotAiry" type="checkbox" checked> 艾里斑</label>
            </div>
            <svg id="spotMain"></svg>
          </div>
          <div id="illumView" class="spotView">
            <div class="spot-ctrl">
              <label title="入瞳内采样网格密度(圆内)">网格 <input id="illumGrid" type="number" value="15" min="5" max="41" step="2"></label>
              <label title="沿视场均匀取的点数">视场点 <input id="illumN" type="number" value="13" min="3" max="41" step="2"></label>
              <label title="用哪个波长(相对照度通常看主波长)">波长 <select id="illumWavelength"><option value="primary">主波长</option></select></label>
            </div>
            <svg id="illumMain"></svg>
          </div>
          <div id="mtfView" class="spotView">
            <div class="spot-ctrl">
              <label title="MTF 算法">算法 <select id="mtfAlgo"><option value="geo">几何</option><option value="diff">波前(衍射)</option></select></label>
              <label title="曲线类型：频率曲线 / 离焦曲线(through-focus)">模式 <select id="mtfMode"><option value="freq">频率曲线</option><option value="focus">离焦曲线</option></select></label>
              <label title="离焦曲线的轴向范围(±)，留空按 F# 自动">范围 <input id="mtfFocusRange" type="number" min="0" step="any" value="50" placeholder="自动"> <span id="mtfFocusUnitLabel">µm</span></label>
              <label title="离焦单位(µm / mm)">单位 <select id="mtfFocusUnit"><option value="um">µm</option><option value="mm">mm</option></select></label>
              <label title="显示哪些视场">场 <select id="mtfField"><option value="all">全部</option></select></label>
              <label title="入瞳采样网格密度">网格 <input id="mtfGrid" type="number" value="21" min="7" max="41" step="2"></label>
              <label title="频率曲线的横轴上限 / 离焦曲线的评估频率"><span id="mtfNuLabel">最高频率</span> <input id="mtfNu" type="number" value="45" min="1" max="1000" step="5"> lp/mm</label>
              <label title="用哪个/哪些波长（全部=复色）">波长 <select id="mtfWavelength"><option value="all">全部</option><option value="primary">主波长</option></select></label>
            </div>
            <svg id="mtfMain"></svg>
          </div>
        </div>
      </section>
      <div id="vGrip" class="grip-h" title="拖动调整 图表 与 3D 高度"></div>
      <section id="stage3d">
        <canvas id="view"></canvas>
        <svg id="layout2d"></svg>
        <div id="hud" class="hud hidden">
          <div class="title">Lens-3D · M1+</div>
          <div class="status">Three.js 加载中…</div>
          <div id="fo" class="fo"></div>
        </div>
        <div id="vertReadout" class="vertReadout hidden">顶点 3D 坐标</div>
        <div id="toolbar" class="toolbar">
          <div class="seg" id="viewSeg">
            <button data-view="iso" class="vbtn" type="button">等轴测</button>
            <button data-view="xy" class="vbtn" type="button">X-Y</button>
            <button data-view="yz" class="vbtn" type="button">Y-Z</button>
            <button data-view="xz" class="vbtn" type="button">X-Z</button>
            <button data-view="2d" class="vbtn active" type="button">2D</button>
          </div>
          <span class="sep"></span>
          <button id="resetView" type="button">重置视角(Y-Z)</button>
          <button id="hudToggle" class="btn-link" type="button" title="显示/隐藏 左上信息窗">信息</button>
          <button id="readoutToggle" class="btn-link" type="button" title="显示/隐藏 右上坐标窗">坐标</button>
          <a id="backLauncher" class="btn-link" href="../">返回启动台</a>
          <span class="sep"></span>
          <span class="hint">左键旋转 · 右键/滚轮缩放 · 中键平移</span>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/main.js?v=1.2.3"></script>
</body>
</html>

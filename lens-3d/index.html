<!DOCTYPE html>

</head>
<body>
  <div id="app">

        </div>
        <div class="theme-switch" id="themeSwitch" title="鍒囨崲涓婚">

          <button class="theme-dot" data-theme="graphite" title="鐭冲ⅷ榛? style="background:#cfd8e3"></button>
          <button class="theme-dot" data-theme="violet" title="鏋佸绱? style="background:#b388ff"></button>
          <button class="theme-dot" data-theme="forest" title="鏉炬灄缁? style="background:#5fd0a0"></button>
          <button class="theme-dot" data-theme="light" title="鏃ラ棿娴呰壊" style="background:#ffffff"></button>
        </div>
      </div>

      <div class="topbar">

          <option value="single">鍗曠墖鍙屽嚫鐗╅暅 (F=50mm)</option>
          <option value="planoconvex">骞冲嚫鐗╅暅 (F=80mm)</option>
          <option value="blank">绌虹櫧绯荤粺 (鎵嬪姩鎼?</option>
        </select>
        <button id="importFile" class="btn">瀵煎叆 .zmx/.seq</button>
        <input id="fileInput" type="file" accept=".zmx,.seq" hidden>
        <button id="newDemo" class="btn ghost">閲嶇疆</button>
      </div>

      <div class="fieldbar">
        <label title="Zemax 瑙嗗満=鍗婅鍦鸿(鍗奆OV)銆傚叏瑙嗗満=2脳鍗婅鍦鸿銆傚鍗婅鍦?0掳=鍏ㄨ鍦?0掳銆?>瑙嗗満妯″紡
          <select id="fmode">
            <option value="angle" selected>鍗婅鍦鸿 掳</option>
            <option value="height">鍍忛珮 mm</option>
          </select>
        </label>
        <label title="閫楀彿鍒嗛殧澶氳鍦猴紙鍗婅鍦鸿掳 鎴?鍍忛珮mm锛屾寜璇诲彇鐨勬枃浠跺€硷級">鍊?          <input id="fvals" type="text" value="0" spellcheck="false">
        </label>
        <label title="姣忎釜瑙嗗満鐨勫厜绾挎暟(鍏ョ灣鍐?涓婂彇濂囨暟)">鍏夌嚎鏁?          <input id="npupil" type="number" value="9" min="1" max="33" step="2">
        </label>
        <label title="鍍忔柟宸ヤ綔F/#锛氬叆鐬崇洿寰?|EFL|/F#">宸ヤ綔F鏁?          <input id="wfn" type="number" value="8" placeholder="绌?鐢卞厜闃戝畾" min="0.5" step="0.1">
        </label>
        <button id="autoVig" type="button" title="鎸夊噣鍙ｅ緞/鍗婂瓟寰勮嚜鍔ㄨ绠楅€愯鍦烘笎鏅?琚笎鏅曞厜绾夸笉鏄剧ず)">鑷姩娓愭檿</button>
        <button id="refreshBtn" type="button" title="涓€閿埛鏂帮細琛ㄦ牸/2D/3D/褰撳墠鍥捐〃(鐐瑰垪鍥?鐩稿鐓у害/MTF) 鍏ㄩ儴閲嶆覆鏌?>鍒锋柊</button>
        <span id="fieldVig" class="vig">鏈拷杩?/span>
      </div>

      <div class="wlbar">
        <div class="wl-head">
          <span>娉㈤暱 / 鏉冮噸</span>
          <button id="wlAdd" type="button">锛?娣诲姞</button>
          <button id="wlPreset" type="button" title="F/d/C 涓夎壊(鑹叉暎)">F/d/C</button>
          <button id="wlOnly" type="button" title="鍙繚鐣欎富娉㈤暱">浠呬富</button>
        </div>
        <div id="wltable" class="wl-table"></div>
        <div class="wl-note">鈼忎富娉㈤暱鐢ㄤ簬 EFL/F#路鍍忛珮锛涙潈閲嶇敤浜庡悗缁?MTF/鐐瑰垪骞冲潎锛涙寜娉㈤暱鍒嗚壊灞曠ず</div>
      </div>

      <div id="ldm" class="ldm-root"></div>
    </aside>
    <div id="sideGrip" class="grip-v" title="鎷栧姩璋冩暣宸︿晶(LDM)绐楀彛瀹藉害"></div>

    <main id="stage">
      <section id="panel2d">
        <div class="panel-head">
          <div class="tabs">
            <button id="tabLayout" class="tab active" type="button">2D 鍏夎矾</button>
            <button id="tabSpot" class="tab" type="button">鐐瑰垪鍥?/button>
            <button id="tabIllum" class="tab" type="button">鐩稿鐓у害</button>
            <button id="tabMtf" class="tab" type="button">MTF</button>
          </div>
          <span id="layoutBadge" class="layoutBadge"></span>
        </div>
        <div class="panel2d-body">
          <svg id="layout2d"></svg>
          <div id="spotView" class="spotView">
            <div class="spot-ctrl">
              <label title="鍏ョ灣鍐呴噰鏍风綉鏍煎瘑搴?>缃戞牸 <input id="spotGrid" type="number" value="15" min="5" max="41" step="2"></label>
              <label title="鏄剧ず鍝簺瑙嗗満">鍦?<select id="spotField"><option value="all">鍏ㄩ儴</option></select></label>
              <label title="鐢ㄥ摢涓尝闀?>娉㈤暱 <select id="spotWavelength"><option value="primary">涓绘尝闀?/option></select></label>
              <label title="缁樺埗鑹鹃噷鏂?琛嶅皠鏋侀檺)鍙傝€冨渾"><input id="spotAiry" type="checkbox" checked> 鑹鹃噷鏂?/label>
            </div>
            <svg id="spotMain"></svg>
          </div>
          <div id="illumView" class="spotView">
            <div class="spot-ctrl">
              <label title="鍏ョ灣鍐呴噰鏍风綉鏍煎瘑搴?鍦嗗唴)">缃戞牸 <input id="illumGrid" type="number" value="15" min="5" max="41" step="2"></label>
              <label title="娌胯鍦哄潎鍖€鍙栫殑鐐规暟">瑙嗗満鐐?<input id="illumN" type="number" value="13" min="3" max="41" step="2"></label>
              <label title="鐢ㄥ摢涓尝闀?鐩稿鐓у害閫氬父鐪嬩富娉㈤暱)">娉㈤暱 <select id="illumWavelength"><option value="primary">涓绘尝闀?/option></select></label>
            </div>
            <svg id="illumMain"></svg>
          </div>
          <div id="mtfView" class="spotView">
            <div class="spot-ctrl">
              <label title="MTF 绠楁硶">绠楁硶 <select id="mtfAlgo"><option value="geo">鍑犱綍</option><option value="diff">娉㈠墠(琛嶅皠)</option></select></label>
              <label title="鏄剧ず鍝簺瑙嗗満">鍦?<select id="mtfField"><option value="all">鍏ㄩ儴</option></select></label>
              <label title="鍏ョ灣閲囨牱缃戞牸瀵嗗害">缃戞牸 <input id="mtfGrid" type="number" value="21" min="7" max="41" step="2"></label>
              <label title="妯酱鏈€楂樼┖闂撮鐜?>鏈€楂橀鐜?<input id="mtfNu" type="number" value="100" min="10" max="1000" step="10"> lp/mm</label>
              <label title="鐢ㄥ摢涓?鍝簺娉㈤暱锛堝叏閮?澶嶈壊锛?>娉㈤暱 <select id="mtfWavelength"><option value="all">鍏ㄩ儴</option><option value="primary">涓绘尝闀?/option></select></label>
            </div>
            <svg id="mtfMain"></svg>
          </div>
        </div>
      </section>
      <div id="vGrip" class="grip-h" title="鎷栧姩璋冩暣 2D/鐐瑰垪鍥?涓?3D 楂樺害"></div>
      <section id="stage3d">

        <div id="hud" class="hud">

          <div class="status">Three.js 鍔犺浇涓€?/div>
          <div id="fo" class="fo"></div>
        </div>
        <div id="vertReadout" class="vertReadout">椤剁偣 3D 鍧愭爣</div>
        <div id="toolbar" class="toolbar">
          <div class="seg" id="viewSeg">
            <button data-view="iso" class="vbtn active" type="button">绛夎酱娴?/button>
            <button data-view="xy" class="vbtn" type="button">X-Y</button>
            <button data-view="yz" class="vbtn" type="button">Y-Z</button>
            <button data-view="xz" class="vbtn" type="button">X-Z</button>
          </div>
          <span class="sep"></span>
          <button id="resetView" type="button">閲嶇疆瑙嗚(Y-Z)</button>
          <a id="backLauncher" class="btn-link" href="../">杩斿洖鍚姩鍙?/a>
          <span class="sep"></span>

        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/main.js?v=1.0.2"></script>
